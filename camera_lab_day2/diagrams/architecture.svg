<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 725" role="img"><title>Software responsibilities and ownership</title><rect width="850" height="725" fill="#f2f6f0"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="#1d746f"/></marker></defs><text x="35" y="34" font-family="sans-serif" font-size="24" fill="#173d43">Software responsibilities and ownership</text><rect x="85" y="65" width="680" height="72" rx="10" fill="white" stroke="#88aaa0"/><text x="425" y="93" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#173d43">capture.py / CameraSource</text><text x="425" y="117" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4b686a">Own Picamera2; capture once; finally close</text><path d="M425 138v48" stroke="#1d746f" stroke-width="2" marker-end="url(#a)"/><text x="440" y="164" font-family="sans-serif" font-size="12" fill="#4b686a">Frame + metadata</text><rect x="85" y="190" width="680" height="72" rx="10" fill="white" stroke="#88aaa0"/><text x="425" y="218" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#173d43">files.py / saved Frame</text><text x="425" y="242" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4b686a">Persist evidence; load a validated RGB image</text><path d="M425 263v48" stroke="#1d746f" stroke-width="2" marker-end="url(#a)"/><text x="440" y="289" font-family="sans-serif" font-size="12" fill="#4b686a">Frame + Settings</text><rect x="85" y="315" width="680" height="72" rx="10" fill="white" stroke="#88aaa0"/><text x="425" y="343" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#173d43">core.py / analyze</text><text x="425" y="367" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4b686a">Pure mask + regional features + quality rule</text><path d="M425 388v48" stroke="#1d746f" stroke-width="2" marker-end="url(#a)"/><text x="440" y="414" font-family="sans-serif" font-size="12" fill="#4b686a">Evidence dictionary</text><rect x="85" y="440" width="680" height="72" rx="10" fill="white" stroke="#88aaa0"/><text x="425" y="468" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#173d43">analyze.py / report</text><text x="425" y="492" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4b686a">Write inspectable JSON, image and mask</text><path d="M425 513v48" stroke="#1d746f" stroke-width="2" marker-end="url(#a)"/><text x="440" y="539" font-family="sans-serif" font-size="12" fill="#4b686a">Requires new integration; saved reports do not drive motors</text><rect x="85" y="565" width="680" height="72" rx="10" fill="white" stroke="#88aaa0"/><text x="425" y="593" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#173d43">Future live runner</text><text x="425" y="617" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4b686a">Fresh observations, pose alignment, fusion, bounded action</text></svg>