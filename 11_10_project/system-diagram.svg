<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 870"><title>PiDog Python system and alternative sources</title><rect width="840" height="870" fill="#eef5ef"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="#26736a"/></marker></defs><rect x="220" y="50" width="400" height="70" rx="10" fill="white" stroke="#578e82"/><text x="420.0" y="77" text-anchor="middle" font-family="sans-serif" font-size="18">Scene + lens + sensor</text><text x="420.0" y="101" text-anchor="middle" font-family="sans-serif" font-size="12">Physical light -&gt; camera measurements</text><rect x="220" y="155" width="400" height="70" rx="10" fill="white" stroke="#578e82"/><text x="420.0" y="182" text-anchor="middle" font-family="sans-serif" font-size="18">CSI ribbon + Pi camera stack</text><text x="420.0" y="206" text-anchor="middle" font-family="sans-serif" font-size="12">Processed image buffers on the Raspberry Pi</text><rect x="220" y="260" width="400" height="70" rx="10" fill="white" stroke="#578e82"/><text x="420.0" y="287" text-anchor="middle" font-family="sans-serif" font-size="18">camera.py / Camera</text><text x="420.0" y="311" text-anchor="middle" font-family="sans-serif" font-size="12">Picamera2 -&gt; RGB -&gt; BGR NumPy array</text><rect x="30" y="370" width="340" height="70" rx="10" fill="white" stroke="#578e82"/><text x="200.0" y="397" text-anchor="middle" font-family="sans-serif" font-size="18">Saved image / synthetic fixture</text><text x="200.0" y="421" text-anchor="middle" font-family="sans-serif" font-size="12">Replay or test without hardware</text><rect x="440" y="370" width="370" height="70" rx="10" fill="white" stroke="#578e82"/><text x="625.0" y="397" text-anchor="middle" font-family="sans-serif" font-size="18">run.py / main</text><text x="625.0" y="421" text-anchor="middle" font-family="sans-serif" font-size="12">Choose source; own camera; bounded loop</text><rect x="220" y="490" width="400" height="90" rx="10" fill="white" stroke="#578e82"/><text x="420.0" y="517" text-anchor="middle" font-family="sans-serif" font-size="18">perception.py / analyze</text><text x="420.0" y="541" text-anchor="middle" font-family="sans-serif" font-size="12">HSV -&gt; mask -&gt; components -&gt; evidence</text><rect x="220" y="620" width="400" height="80" rx="10" fill="white" stroke="#578e82"/><text x="420.0" y="647" text-anchor="middle" font-family="sans-serif" font-size="18">run.py / save results</text><text x="420.0" y="671" text-anchor="middle" font-family="sans-serif" font-size="12">PNG images + JSON facts + text history</text><rect x="220" y="740" width="400" height="70" rx="10" fill="white" stroke="#578e82"/><text x="420.0" y="767" text-anchor="middle" font-family="sans-serif" font-size="18">Browser + iPad notes</text><text x="420.0" y="791" text-anchor="middle" font-family="sans-serif" font-size="12">Display evidence; predict, inspect, explain</text><path d="M420 120V155" fill="none" stroke="#26736a" stroke-width="2" marker-end="url(#a)"/><path d="M420 225V260" fill="none" stroke="#26736a" stroke-width="2" marker-end="url(#a)"/><path d="M620 295H720V370" fill="none" stroke="#26736a" stroke-width="2" marker-end="url(#a)"/><path d="M370 405H440" fill="none" stroke="#26736a" stroke-width="2" marker-end="url(#a)"/><path d="M620 440V460H420V490" fill="none" stroke="#26736a" stroke-width="2" marker-end="url(#a)"/><path d="M420 580V620" fill="none" stroke="#26736a" stroke-width="2" marker-end="url(#a)"/><path d="M420 700V740" fill="none" stroke="#26736a" stroke-width="2" marker-end="url(#a)"/><text x="420" y="845" text-anchor="middle" font-family="sans-serif" font-size="15">Robot HAT / servos: outside this program. No movement commands.</text></svg>