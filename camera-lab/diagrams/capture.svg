<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 850" role="img"><title>From light to a Python image</title><rect width="850" height="850" fill="#f2f6f0"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="#1d746f"/></marker></defs><text x="35" y="34" font-family="sans-serif" font-size="24" fill="#173d43">From light to a Python image</text><rect x="85" y="65" width="680" height="72" rx="10" fill="white" stroke="#88aaa0"/><text x="425" y="93" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#173d43">Scene + light</text><text x="425" y="117" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4b686a">Reflectance, illumination, geometry</text><path d="M425 138v48" stroke="#1d746f" stroke-width="2" marker-end="url(#a)"/><text x="440" y="164" font-family="sans-serif" font-size="12" fill="#4b686a">Light</text><rect x="85" y="190" width="680" height="72" rx="10" fill="white" stroke="#88aaa0"/><text x="425" y="218" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#173d43">Lens + sensor</text><text x="425" y="242" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4b686a">Light becomes sampled electrical measurements</text><path d="M425 263v48" stroke="#1d746f" stroke-width="2" marker-end="url(#a)"/><text x="440" y="289" font-family="sans-serif" font-size="12" fill="#4b686a">Sensor measurements</text><rect x="85" y="315" width="680" height="72" rx="10" fill="white" stroke="#88aaa0"/><text x="425" y="343" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#173d43">CSI + camera stack</text><text x="425" y="367" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4b686a">Transfer, sensor control and image processing</text><path d="M425 388v48" stroke="#1d746f" stroke-width="2" marker-end="url(#a)"/><text x="440" y="414" font-family="sans-serif" font-size="12" fill="#4b686a">Processed image buffer</text><rect x="85" y="440" width="680" height="72" rx="10" fill="white" stroke="#88aaa0"/><text x="425" y="468" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#173d43">Picamera2 + Pillow</text><text x="425" y="492" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4b686a">Capture image; make RGB explicit; resize</text><path d="M425 513v48" stroke="#1d746f" stroke-width="2" marker-end="url(#a)"/><text x="440" y="539" font-family="sans-serif" font-size="12" fill="#4b686a">RGB pixels</text><rect x="85" y="565" width="680" height="72" rx="10" fill="white" stroke="#88aaa0"/><text x="425" y="593" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#173d43">Frame object</text><text x="425" y="617" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4b686a">width, height, row-major RGB values</text><path d="M425 638v48" stroke="#1d746f" stroke-width="2" marker-end="url(#a)"/><text x="440" y="664" font-family="sans-serif" font-size="12" fill="#4b686a">Explicit input values</text><rect x="85" y="690" width="680" height="72" rx="10" fill="white" stroke="#88aaa0"/><text x="425" y="718" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#173d43">Perception functions</text><text x="425" y="742" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4b686a">Mask, regional fractions and limited claims</text></svg>