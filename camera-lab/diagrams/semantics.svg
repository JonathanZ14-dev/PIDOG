<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 725" role="img"><title>Different questions need different evidence</title><rect width="850" height="725" fill="#f2f6f0"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="#1d746f"/></marker></defs><text x="35" y="34" font-family="sans-serif" font-size="24" fill="#173d43">Different questions need different evidence</text><rect x="85" y="65" width="680" height="72" rx="10" fill="white" stroke="#88aaa0"/><text x="425" y="93" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#173d43">Pixels</text><text x="425" y="117" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4b686a">What values arrived at each image location?</text><path d="M425 138v48" stroke="#1d746f" stroke-width="2" marker-end="url(#a)"/><text x="440" y="164" font-family="sans-serif" font-size="12" fill="#4b686a">Color / texture transformations</text><rect x="85" y="190" width="680" height="72" rx="10" fill="white" stroke="#88aaa0"/><text x="425" y="218" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#173d43">Visual features</text><text x="425" y="242" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4b686a">Which locations match a rule or learned pattern?</text><path d="M425 263v48" stroke="#1d746f" stroke-width="2" marker-end="url(#a)"/><text x="440" y="289" font-family="sans-serif" font-size="12" fill="#4b686a">Rule or learned model plus task definition</text><rect x="85" y="315" width="680" height="72" rx="10" fill="white" stroke="#88aaa0"/><text x="425" y="343" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#173d43">Meaning / task labels</text><text x="425" y="367" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4b686a">Blue region? Box? An obstacle in this path?</text><path d="M425 388v48" stroke="#1d746f" stroke-width="2" marker-end="url(#a)"/><text x="440" y="414" font-family="sans-serif" font-size="12" fill="#4b686a">Additional measurements and assumptions</text><rect x="85" y="440" width="680" height="72" rx="10" fill="white" stroke="#88aaa0"/><text x="425" y="468" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#173d43">Geometry + uncertainty</text><text x="425" y="492" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4b686a">Where is it; how fresh and reliable is the evidence?</text><path d="M425 513v48" stroke="#1d746f" stroke-width="2" marker-end="url(#a)"/><text x="440" y="539" font-family="sans-serif" font-size="12" fill="#4b686a">Validated policy; no motor connection in this lab</text><rect x="85" y="565" width="680" height="72" rx="10" fill="white" stroke="#88aaa0"/><text x="425" y="593" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#173d43">Decision boundary</text><text x="425" y="617" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4b686a">What action is justified by these observations?</text></svg>